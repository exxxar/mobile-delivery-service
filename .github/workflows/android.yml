name: Build Android APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          FASTORAN_API_BASE_URL: ${{ secrets.FASTORAN_API_BASE_URL }}
          FASTORAN_TENANT_KEY: ${{ secrets.FASTORAN_TENANT_KEY }}
          FASTORAN_TENANT_SLUG: ${{ secrets.FASTORAN_TENANT_SLUG }}
        run: |
          gradle --no-daemon \
            -PFASTORAN_API_BASE_URL="${FASTORAN_API_BASE_URL:-https://example.com}" \
            -PFASTORAN_TENANT_KEY="${FASTORAN_TENANT_KEY:-}" \
            -PFASTORAN_TENANT_SLUG="${FASTORAN_TENANT_SLUG:-}" \
            assembleDebug
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fastoran-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
