name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          FASTORAN_API_BASE_URL: ${{ secrets.FASTORAN_API_BASE_URL }}
          FASTORAN_TENANT_KEY: ${{ secrets.FASTORAN_TENANT_KEY }}
        run: |
          gradle --no-daemon \
            -PFASTORAN_API_BASE_URL="${FASTORAN_API_BASE_URL:-https://example.com/api/mobile/v1/}" \
            -PFASTORAN_TENANT_KEY="${FASTORAN_TENANT_KEY:-SET_TENANT_KEY}" \
            assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastoran-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
