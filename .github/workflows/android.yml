
name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fastoran Mini
    runs-on: ubuntu-latest

    steps:
      # Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Настройка Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Установка необходимых Android SDK пакетов
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Настройка Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Сборка APK
      - name: Build Debug APK
        env:
          FASTORAN_API_BASE_URL: ${{ secrets.FASTORAN_API_BASE_URL }}
          FASTORAN_TENANT_KEY: ${{ secrets.FASTORAN_TENANT_KEY }}
        run: |
          gradle --no-daemon \
            -PFASTORAN_API_BASE_URL="${FASTORAN_API_BASE_URL:-https://example.com/api/mobile/v1/}" \
            -PFASTORAN_TENANT_KEY="${FASTORAN_TENANT_KEY:-SET_TENANT_KEY}" \
            assembleDebug

      # Проверка наличия APK
      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # Загрузка APK в GitHub Actions Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fastoran-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
